<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Needle Distribution</title>

<style>
:root{
  --bg:#f5f6f8;
  --card:#fff;
  --ink:#111;
  --muted:#6b7280;
  --dial:#2563eb;
  --cyl:#d97706;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family: Inter, system-ui, -apple-system;
  background:var(--bg);
  color:var(--ink);
}
header{
  position:sticky;
  top:0;
  background:rgba(255,255,255,.9);
  backdrop-filter: blur(14px);
  padding:16px;
  font-size:18px;
  font-weight:700;
  border-bottom:1px solid #e5e7eb;
}
.container{ padding:14px; }
.card{
  background:var(--card);
  border-radius:18px;
  padding:14px;
  margin-bottom:14px;
  box-shadow:0 10px 28px rgba(0,0,0,.06);
}
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.machine{ font-size:18px; font-weight:700; }
.qty{ font-size:22px; font-weight:800; }
.row{
  display:flex;
  justify-content:space-between;
  margin-top:6px;
  font-size:14px;
}
.badge{
  padding:4px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
}
.dial{ background:#dbeafe; color:var(--dial); }
.cylinder{ background:#fef3c7; color:var(--cyl); }
.date{
  font-size:12px;
  color:var(--muted);
  margin-top:6px;
}
</style>
</head>

<body>

<header>🪡 Needle Distribution</header>

<div class="container" id="list">
  Loading data…
</div>

<script>
/* 🔴 APPS SCRIPT WEB APP URL */
const API =
  "https://script.google.com/macros/s/AKfycbyRQ984Va6T6_0BTdyK_b_i5S70noWUv2ZEZAxixpI6JJfJcedztTnVj3YmdDiSxJN8pQ/exec";

/* JSONP callback */
function renderData(data){
  const list = document.getElementById("list");

  if(!data || data.length === 0){
    list.innerHTML = "No records found.";
    return;
  }

  list.innerHTML = data.reverse().map(d => `
    <div class="card">
      <div class="top">
        <div class="machine">Machine ${d.machine}</div>
        <div class="qty">${d.qty}</div>
      </div>

      <div class="row">
        <div>${d.needle}</div>
        <span class="badge ${d.section === 'Dial' ? 'dial' : 'cylinder'}">
          ${d.section}
        </span>
      </div>

      <div class="date">
        ${new Date(d.date).toLocaleString()}
      </div>

      ${d.remark ? `<div class="row">Note: ${d.remark}</div>` : ''}
    </div>
  `).join('');
}

/* 🔥 JSONP loader */
(function(){
  const s = document.createElement("script");
  s.src = API + "?action=getData&callback=renderData";
  document.body.appendChild(s);
})();
</script>

</body>
</html>
